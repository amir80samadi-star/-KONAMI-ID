    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

        .container {

        }

            display: block;
            margin-bottom: 7px;
            color: #999999;
            font-size: 14px;
        }

        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            outline: none;
            background: #ffffff;
            color: #666666;
            font-size: 15px;
            transition: 0.3s;
        }

        input[type="email"]:focus,
        input[type="text"]:focus {
            border-color: #bbbbbb;
        }

        input::placeholder {
            color: #bbbbbb;
        }

        .agree {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 20px 0;
            font-size: 13px;
            color: #999999;
        }

        .agree input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #e53935;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #c62828;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #aaaaaa;
